budget.execution_ajax:
  path: '/budget/execution/ajax'
  defaults:
    _controller: '\Drupal\budget\Controller\ExecutionAjaxController::getData'
    _title: 'Execution AJAX'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
budget.execution_incomes_ajax:
  path: '/budget/execution_incomes/ajax'
  defaults:
    _controller: '\Drupal\budget\Controller\ExecIncomesAjaxCntr::getData'
    _title: 'Execution AJAX'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
budget.execution_expens_ajax:
  path: '/budget/execution_expens/ajax'
  defaults:
    _controller: '\Drupal\budget\Controller\ExecExpensAjaxCntr::getData'
    _title: 'Execution AJAX'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
budget.execution_expens_munprog_ajax:
  path: '/budget/execution_expens_munprog/ajax'
  defaults:
    _controller: '\Drupal\budget\Controller\ExecExpensMunprogAjaxCntr::getData'
    _title: 'Execution AJAX'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
budget.execution_funding_ajax:
  path: '/budget/execution_funding/ajax'
  defaults:
    _controller: '\Drupal\budget\Controller\ExecFundingAjaxCntr::getData'
    _title: 'Execution AJAX'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
budget.execution_invest_ajax:
  path: '/budget/execution_invest_ajax/ajax'
  defaults:
    _controller: '\Drupal\budget\Controller\ExecInvestAjaxCntr::getData'
    _title: 'Execution AJAX'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
budget.feedback_ajax:
  path: '/budget/feedback/ajax'
  defaults:
    _controller: '\Drupal\budget\Controller\FeedbackAjax::setData'
    _title: 'Execution AJAX'
  requirements:
    _permission: 'access content'
    _method: 'POST'
  options:
    no_cache: TRUE
budget.finance_add:
  path: '/admin/finances/add'
  defaults:
    _form: '\Drupal\budget\Form\CityFinanceForm'
    _title: 'Бюджеты городов-аналогов'
  requirements:
    _permission: 'administer site configuration'
  options:
    no_cache: TRUE
budget.finance_delete:
  path: '/admin/finances/delete/{year}'
  defaults:
    _form: '\Drupal\budget\Form\CityFinanceDeleteForm'
    _title: 'Delete year data'
  requirements:
    _permission: 'administer site configuration'
  options:
    no_cache: TRUE
budget.comparison_ajax:
  path: '/monitoring/ComparisonFilter'
  defaults:
    _controller: '\Drupal\budget\Controller\CityFinanceAjaxController::getComparisonData'
    _title: 'Comparison AJAX'
  requirements:
    _permission: 'access content'
  methods: [POST]
