graph_project.import:
  path: '/admin/content/graph-project/import'
  defaults:
    _form: '\Drupal\graph_project\Form\GraphProjectImport'
    _title: 'Импорт графика подготовки бюджета'
  requirements:
    _permission: 'administer content'
graph_project.graphics:
  path: '/about/graphics'
  defaults:
    _controller: '\Drupal\graph_project\Controller\GraphicsController::page'
    _title: 'График подготовки проекта бюджета'
  requirements:
    _permission: 'access content'
